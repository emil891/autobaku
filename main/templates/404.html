
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Səhifə tapılmadı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f1f5f9;
            padding: 80px 20px;
        }

        .xeta-kart {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 70px;
            color: #2563eb;
            margin: 0;
        }

        p {
            color: #475569;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="xeta-kart">
        <h1>404</h1>
        <h2>Səhifə tapılmadı!</h2>
        <p>Axtardığın məqalə mövcud deyil və ya silinib.</p>
        <a href="/">Ana səhifəyə qayıt</a>
    </div>
</body>
</html>
