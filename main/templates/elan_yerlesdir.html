{% load static %}
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Elan yerləşdir - AutoBaku</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .form-konteyner { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .form-konteyner h2 { margin-top: 0; color: #252525; margin-bottom: 20px; }
        .form-konteyner p { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; font-weight: bold; color: #444; }
        .form-konteyner input, .form-konteyner select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .form-konteyner button { width: 100%; background: #ca1016; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .form-konteyner button:hover { background: #b00d12; }
    </style>
</head>
<body style="background: #f3f4f6; font-family: Arial, sans-serif; margin: 0;">

    <header class="ust-hisse">
        <div class="ust-konteyner">
            <a href="/" class="sayt-loqo">AUTO<span>BAKU</span></a>
        </div>
    </header>

    <div class="form-konteyner">
        <h2>Yeni avtomobil elanı yerləşdir</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Elanı yerləşdir</button>
        </form>
    </div>

</body>
</html>
